site_name: Supervised Multi-Dimensional Scaling
site_url: https://ukplab.github.io/smds
nav:
  - Home: index.md
  - Usage Walkthrough: usage.md
  - Available Shapes: shapes.md
  - API Reference:
      - Core Estimators: api/core.md
      - Shapes: api/shapes.md
      - Stress Metrics: api/stress.md
  - Examples:
      - Find Manifold Location: notebooks/find_manifold_location.ipynb
      - Family Tree Experiment: notebooks/family_tree.ipynb
      - Find Hour-of-Day Manifold: notebooks/hour_experiment.ipynb
      - Manifold Activation Patching: notebooks/manifold_activation_patching.ipynb
      - Adding a custom Shape: examples/custom_shape.md
      - Finding manifold of color in VLMs: notebooks/emergence_of_color_manifold_in_VLM.ipynb

theme:
  name: material
  logo: assets/logo_white.png
  favicon: assets/favicon.png
  features:
    - navigation.sections
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            show_bases: true
            members_order: source
  - mkdocs-jupyter:
      execute: false
      include_source: true
      show_input: true
